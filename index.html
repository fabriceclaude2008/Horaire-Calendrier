<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda – Automne 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--c:var(--autre);--bg:#eef1f6;--sf:#fff;--ink:#101828;--mute:#5b667a;--line:#d9dfe9;--onc:#fff;--alg:#1f5fbf;--philo:#8a3d9c;--eco:#12805f;--autre:#6b7280;--warn:#b42318}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0c111b;--sf:#151c2a;--ink:#e7ebf3;--mute:#98a3b8;--line:#263046;--onc:#0c111b;--alg:#6aa0ff;--philo:#cf8be0;--eco:#4fcfa3;--autre:#9aa3b2;--warn:#ff8a7a}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0c111b;--sf:#151c2a;--ink:#e7ebf3;--mute:#98a3b8;--line:#263046;--onc:#0c111b;--alg:#6aa0ff;--philo:#cf8be0;--eco:#4fcfa3;--autre:#9aa3b2;--warn:#ff8a7a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Schibsted Grotesk",system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:1100px;margin:0 auto;padding:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
select,input,textarea{background:var(--sf);color:var(--ink)}
select,input[type=date],input[type=time]{min-height:34px}
:focus-visible{outline:2px solid var(--alg);outline-offset:2px}
[data-c=alg]{--c:var(--alg)}[data-c=philo]{--c:var(--philo)}[data-c=eco]{--c:var(--eco)}[data-c=autre]{--c:var(--autre)}
.hero{background:var(--ink);color:var(--bg);border-radius:14px;padding:20px 22px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero .big{font-size:clamp(56px,12vw,96px);font-weight:800;line-height:.9;letter-spacing:-.04em}
.hero h1{margin:0 0 4px;font-size:clamp(20px,3.4vw,30px);font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;opacity:.75}
.hero .r{text-align:right}
nav{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap;align-items:center}
nav .tab{border:1px solid var(--line);background:var(--sf);border-radius:999px;padding:7px 16px;font-weight:500}
nav .tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:7px 12px;font-weight:500}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.del{color:var(--warn)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:14px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:150px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);font-size:12px}
.cal>*{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .h{padding:6px 4px;font-weight:700;color:var(--mute);text-align:center;background:var(--bg)}
.cal .wk{color:var(--mute);font-size:10px;font-weight:700;padding:4px 2px;text-align:center;background:var(--bg);writing-mode:vertical-rl;transform:rotate(180deg)}
.day{min-height:92px;padding:3px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.day:hover{background:color-mix(in srgb,var(--ink) 4%,var(--sf))}
.day.out{opacity:.6}
.day.rel{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--mute) 12%,transparent) 6px 12px)}
.day .n{font-weight:700;font-size:12px;padding:1px 4px;align-self:flex-start;border-radius:6px}
.day.today .n{background:var(--ink);color:var(--bg)}
.chip{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 15%,var(--sf));border-radius:4px;padding:2px 5px;font-size:11.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.exam{background:var(--c);color:var(--onc);font-weight:700}
.chip.done{opacity:.45;text-decoration:line-through}
.grp{margin:18px 0 6px;font-weight:700;display:flex;gap:10px;align-items:baseline}
.grp small{color:var(--mute);font-weight:500}
.grp.late{color:var(--warn)}
.it{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}
.it input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--ink)}
.it .t{flex:1;min-width:0}
.it .t b{display:block;cursor:pointer}
.it .t span{color:var(--mute);font-size:13px}
.tag{display:inline-block;border:1.5px solid var(--c);color:var(--c);border-radius:6px;padding:0 6px;font-size:12px;font-weight:700;margin-right:4px}
.tag.exam{background:var(--c);color:var(--onc)}
.it.done b{text-decoration:line-through;opacity:.5}
.empty{padding:30px;text-align:center;color:var(--mute)}
.sw{overflow-x:auto}
.sched{display:grid;grid-template-columns:44px repeat(5,minmax(110px,1fr));min-width:650px}
.sched .dh{padding:8px;text-align:center;font-weight:700;border-bottom:1px solid var(--line)}
.sched .dh.today{color:var(--alg)}
.hrs{position:relative;height:572px}
.hrs i{position:absolute;right:6px;font-style:normal;font-size:11px;color:var(--mute);transform:translateY(-50%)}
.col{position:relative;height:572px;border-left:1px solid var(--line);background:repeating-linear-gradient(var(--line) 0 1px,transparent 1px 52px)}
.blk{position:absolute;left:3px;right:3px;text-align:left;border:0;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 18%,var(--sf));border-radius:6px;padding:4px 7px;overflow:hidden;font-size:12.5px;line-height:1.3}
.blk b{display:block}
.blk span{color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--sf);color:var(--ink);padding:20px;width:min(440px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,15,25,.55)}
dialog h3{margin:0 0 12px;font-size:20px;font-weight:800}
label{display:block;font-weight:500;font-size:13px;margin-bottom:10px}
label input,label select,label textarea{display:block;width:100%;margin-top:3px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
label.ck{display:flex;gap:8px;align-items:center}
label.ck input{width:auto;margin:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.acts .l{margin-right:auto}
.foot{margin:22px 0 8px;color:var(--mute);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.foot .sp{flex:1}
.rg{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:10px;padding:14px 18px;margin-bottom:12px}
.rg b{display:block;font-size:44px;font-weight:800;line-height:1;letter-spacing:-.03em}
.rg span{opacity:.8;font-size:13px}
.par{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.hint{color:var(--mute);font-size:13px;margin:6px 0}
.co{margin-top:14px}
.co .nm{flex:1;min-width:160px;font-weight:800;font-size:18px;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.co .u{margin:0;width:150px}
table.ev{width:100%;border-collapse:collapse;min-width:560px}
.ev th{text-align:left;font-size:12px;color:var(--mute);font-weight:700;padding:4px}
.ev td{padding:3px}
.ev td:first-child{width:34%}
.ev input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
.kp div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kp b{display:block;font-size:20px}
.kp span{color:var(--mute);font-size:12px}
.kp .r{background:var(--ink);color:var(--bg)}
.kp .r span{color:var(--bg);opacity:.8}
details{margin:10px 0}
summary{cursor:pointer;font-weight:500}
.it .dt{padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:13px}
#toast{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#warn{background:var(--warn);color:var(--onc);padding:10px 14px;border-radius:10px;margin-bottom:12px;font-weight:500}
@media(max-width:640px){main{padding:10px}.hero .r{text-align:left}.day{min-height:70px}.chip{font-size:10.5px;padding:1px 3px}}
@media(prefers-reduced-motion:no-preference){.hero .big{animation:pop .5s ease-out}@keyframes pop{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>
<main>
  <div id="warn" hidden role="alert">Ce navigateur bloque l'enregistrement : tes modifications disparaîtront à la fermeture. Ouvre l'app depuis ton adresse Vercel (pas dans un aperçu) ou utilise « Exporter » pour sauvegarder.</div>
  <section class="hero" id="hero" aria-live="polite"></section>
  <nav role="tablist">
    <button class="tab" role="tab" data-v="cal">Calendrier</button>
    <button class="tab" role="tab" data-v="list">À faire</button>
    <button class="tab" role="tab" data-v="sched">Horaire</button>
    <button class="tab" role="tab" data-v="notes">Notes et cote R</button>
    <span class="sp"></span>
    <button class="btn pri" id="add">Ajouter un examen ou devoir</button>
  </nav>
  <section id="view"></section>
  <div class="foot">
    <span>Données enregistrées dans ce navigateur.</span><span class="sp"></span>
    <button class="btn" id="theme">Thème</button>
    <button class="btn" id="exp">Exporter</button>
    <button class="btn" id="imp">Importer</button>
    <button class="btn del" id="rst">Réinitialiser</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
</main>

<div id="toast" role="status"></div>

<dialog id="dEv">
  <form method="dialog" id="fEv">
    <h3 id="evT">Nouvel élément</h3>
    <label>Titre<input name="title" required maxlength="80"></label>
    <div class="g2">
      <label>Cours<select name="course"></select></label>
      <label>Type<select name="type"></select></label>
      <label>Date<input type="date" name="date" required></label>
      <label>Heure (facultatif)<input type="time" name="time"></label>
    </div>
    <label class="ck"><input type="checkbox" name="approx"> Date à confirmer</label>
    <label>Notes<textarea name="notes" rows="2" maxlength="300" placeholder="Pondération, matière, local…"></textarea></label>
    <div class="acts"><button type="button" class="btn del l" id="evDel">Supprimer</button><button type="button" class="btn" data-close>Annuler</button><button class="btn pri" value="ok">Enregistrer</button></div>
  </form>
</dialog>

<dialog id="dBl">
  <form method="dialog" id="fBl">
    <h3 id="blT">Nouveau cours</h3>
    <label>Titre<input name="title" required maxlength="60"></label>
    <div class="g2">
      <label>Cours<select name="course"></select></label>
      <label>Jour<select name="day"></select></label>
      <label>Début<input type="time" name="start" required></label>
      <label>Fin<input type="time" name="end" required></label>
    </div>
    <label>Local<input name="room" maxlength="20"></label>
    <div class="acts"><button type="button" class="btn del l" id="blDel">Supprimer</button><button type="button" class="btn" data-close>Annuler</button><button class="btn pri" value="ok">Enregistrer</button></div>
  </form>
</dialog>

<script>
const KEY='agenda-garneau-a2026-v1', S0=new Date(2026,7,24);
const CO={alg:'Algèbre linéaire',philo:'Philosophie',eco:'Économie globale',autre:'Autre'};
const TY={exam:'Examen',devoir:'Devoir',labo:'Laboratoire',test:'Test en ligne',autre:'Autre'};
const DJ=['Lundi','Mardi','Mercredi','Jeudi','Vendredi'];
const E=(title,course,type,date,notes='',approx=false)=>({title,course,type,date,notes,approx,time:'',done:false});
const SEED_EV=()=>[
 E('Examen 1','alg','exam','2026-09-24','25 %'),
 E('Laboratoire Excel','alg','labo','2026-10-26','6 % – local A-2153'),
 E('Examen 2','alg','exam','2026-11-12','25 %'),
 E('Minitest historique','alg','test','2026-12-03','3 %'),
 E('Examen 3 – synthèse','alg','exam','2026-12-18','35 % – entre le 18 et le 22 décembre',true),
 E('Examen 1','philo','exam','2026-10-05','20 % – semaine 7 (cours B)',true),
 E('Examen 2','philo','exam','2026-11-16','30 % – semaine 13 (cours A)',true),
 E('Texte argumentatif final','philo','exam','2026-12-08','25 % – en classe'),
 E('Examen 1','eco','exam','2026-09-22','25 % – semaine 5',true),
 E('Test Moodle 1','eco','test','2026-09-08','5 % – semaine 3',true),
 E('Résumé vidéo','eco','devoir','2026-10-12','5 % – semaine 8',true),
 E('Test Moodle 2','eco','test','2026-10-12','5 % – semaine 8',true),
 E('Examen 2','eco','exam','2026-10-27','25 % – semaine 10',true),
 E('Test Moodle 3','eco','test','2026-11-17','5 % – semaine 13',true),
 E('Examen 3 – synthèse','eco','exam','2026-12-01','30 % – semaine 15',true),
 E('Date limite de désinscription','eco','devoir','2026-09-18'),
 E("Date limite d'abandon",'eco','devoir','2026-11-03')
].map((e,i)=>({...e,id:'e'+i}));
const B=(day,start,end,title,course,room='')=>({day,start,end,title,course,room});
const SEED_BL=()=>[
 B(1,'10:00','11:50','Philosophie et rationalité','philo','A-2132'),
 B(1,'16:00','17:50','Algèbre linéaire','alg','C-2440'),
 B(2,'12:00','13:50','Activités sciences humaines','autre'),
 B(2,'14:00','16:50','Initiation à l’économie globale','eco','A-3064'),
 B(3,'09:00','11:50','Méthodes de travail','autre','B-2309'),
 B(3,'12:00','13:50','Philosophie et rationalité','philo','A-2130'),
 B(3,'16:00','18:50','Écriture et littérature','autre','C-2436'),
 B(4,'10:00','11:50','Multisports','autre','E-1633'),
 B(4,'12:00','13:50','Vie étudiante','autre'),
 B(4,'16:00','17:50','Algèbre linéaire','alg','G-2823'),
 B(5,'09:00','11:50','Introduction à la gestion','autre','G-1873'),
 B(5,'12:00','13:50','Écriture et littérature','autre','C-2434')
].map((b,i)=>({...b,id:'b'+i}));

const EV=(name,w)=>({name,w,grade:'',mean:'',sd:''});
const SEED_GR=()=>({p:{ifgz:'0',idgz:'1',rho:'0.7'},c:[
 {id:'g1',name:'Algèbre linéaire',units:'2.33',ifgz:'',idgz:'',fm:'',fs:'',ev:[EV('Examen 1',25),EV('Laboratoire Excel',6),EV('Examen 2',25),EV('Minitest historique',3),EV('Examen 3 – synthèse',35)]},
 {id:'g2',name:'Philosophie et rationalité',units:'2.33',ifgz:'',idgz:'',fm:'',fs:'',ev:[EV('Examen 1',20),EV('Examen 2',30),EV('Texte argumentatif final',25),EV('Travaux courts (5)',15),EV('Journaux de lecture (6)',10)]},
 {id:'g3',name:'Initiation à l’économie globale',units:'2.33',ifgz:'',idgz:'',fm:'',fs:'',ev:[EV('Examen 1',25),EV('Résumé vidéo',5),EV('Examen 2',25),EV('Examen 3 – synthèse',30),EV('Tests Moodle (3)',15)]}
].map(c=>({...c,ev:c.ev.map((e,i)=>({...e,id:c.id+'-'+i}))}))});
let st=load(), view='cal', cur=new Date(); cur.setDate(1);
let tt;function toast(m){const t=document.querySelector('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1400)}
let fCourse='', fPer='up';
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.ev&&s.bl){s.gr=s.gr||SEED_GR();return s}}catch(e){}return{ev:SEED_EV(),bl:SEED_BL(),gr:SEED_GR()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));document.querySelector('#warn').hidden=true;toast('Enregistré ✓');return true}catch(e){document.querySelector('#warn').hidden=false;toast('Non enregistré');return false}}
const $=s=>document.querySelector(s), p2=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const todayS=()=>iso(new Date());
const diff=s=>Math.round((parse(s)-parse(todayS()))/864e5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const tm=t=>{const[h,m]=t.split(':');return +h+m/60};
const fmtD=(s,o)=>parse(s).toLocaleDateString('fr-CA',o);
const sorted=()=>[...st.ev].sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
const rel=n=>n===0?"aujourd'hui":n===1?'demain':n===-1?'hier':n>0?`dans ${n} jours`:`il y a ${-n} jours`;
const evTitle=e=>`${e.approx?'~ ':''}${e.title} · ${CO[e.course]}`;

function hero(){
  const nx=sorted().find(e=>e.type==='exam'&&!e.done&&diff(e.date)>=0);
  const h=$('#hero');
  if(!nx){h.innerHTML='<div><h1>Aucun examen à venir</h1><p>Ajoute tes prochaines évaluations avec le bouton ci-dessous.</p></div>';return}
  const n=diff(nx.date);
  h.innerHTML=`<div><p>Prochain examen</p><h1>${esc(nx.title)} – ${CO[nx.course]}</h1><p>${fmtD(nx.date,{weekday:'long',day:'numeric',month:'long'})}${nx.approx?' (à confirmer)':''}${nx.notes?' · '+esc(nx.notes):''}</p></div><div class="r"><div class="big">${n}</div><p>${n===0?"c'est aujourd'hui":n===1?'jour':'jours'}</p></div>`;
}

function calView(){
  const y=cur.getFullYear(), m=cur.getMonth(), first=new Date(y,m,1);
  const start=new Date(y,m,1-((first.getDay()+6)%7));
  let h=`<div class="card"><div class="bar"><h2>${first.toLocaleDateString('fr-CA',{month:'long',year:'numeric'})}</h2><button class="btn" data-nav="-1" aria-label="Mois précédent">‹</button><button class="btn" data-nav="0">Aujourd'hui</button><button class="btn" data-nav="1" aria-label="Mois suivant">›</button></div><div class="cal"><div class="h"></div>`;
  ['lun','mar','mer','jeu','ven','sam','dim'].forEach(d=>h+=`<div class="h">${d}</div>`);
  for(let r=0;r<6;r++){
    const ws=new Date(start.getFullYear(),start.getMonth(),start.getDate()+r*7);
    const wk=Math.floor((Math.round((ws-S0)/864e5))/7)+1, isRel=wk===8;
    h+=`<div class="wk">${wk>=1&&wk<=16?(isRel?'Relâche':'S'+wk):''}</div>`;
    for(let c=0;c<7;c++){
      const d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+c), s=iso(d);
      const evs=sorted().filter(e=>e.date===s);
      h+=`<div class="day${d.getMonth()!==m?' out':''}${s===todayS()?' today':''}${isRel&&c<5?' rel':''}" data-date="${s}"><span class="n">${d.getDate()}</span>${evs.map(e=>`<button class="chip${e.type==='exam'?' exam':''}${e.done?' done':''}" data-c="${e.course}" data-id="${e.id}" title="${esc(evTitle(e))}">${e.approx?'~ ':''}${esc(e.title)}</button>`).join('')}</div>`;
    }
  }
  h+='</div></div><p class="foot">Clique sur un jour pour ajouter un élément. Les éléments avec ~ ont une date à confirmer. Le motif rayé indique la semaine de relâche.</p>';
  return h;
}

function listView(){
  const t=todayS();
  let evs=sorted().filter(e=>(!fCourse||e.course===fCourse)&&(fPer==='all'||(fPer==='up'?e.date>=t||(!e.done&&e.date<t):e.date<t)));
  if(fPer==='up')evs=evs.filter(e=>e.date>=t||!e.done);
  let h=`<div class="card"><div class="bar"><h2>À faire</h2><select id="fPer" aria-label="Période"><option value="up"${fPer==='up'?' selected':''}>À venir et en retard</option><option value="past"${fPer==='past'?' selected':''}>Passés</option><option value="all"${fPer==='all'?' selected':''}>Tout</option></select><select id="fCo" aria-label="Cours"><option value="">Tous les cours</option>${Object.entries(CO).map(([k,v])=>`<option value="${k}"${fCourse===k?' selected':''}>${v}</option>`).join('')}</select></div>`;
  if(!evs.length)return h+'<div class="empty">Rien à afficher. Ajoute un examen ou un devoir pour commencer.</div></div>';
  let last='';
  evs.forEach(e=>{
    if(e.date!==last){last=e.date;const n=diff(e.date);h+=`<div class="grp${n<0&&!e.done?' late':''}">${fmtD(e.date,{weekday:'long',day:'numeric',month:'long'})}<small>${rel(n)}</small></div>`}
    h+=`<div class="it${e.done?' done':''}" data-c="${e.course}"><input type="checkbox" data-done="${e.id}"${e.done?' checked':''} aria-label="Terminé"><div class="t"><b data-id="${e.id}">${e.approx?'~ ':''}${esc(e.title)}</b><span><span class="tag${e.type==='exam'?' exam':''}">${TY[e.type]}</span>${CO[e.course]}${e.time?' · '+e.time:''}${e.approx?' · date à confirmer':''}${e.notes?' · '+esc(e.notes):''}</span></div><input type="date" class="dt" data-date="${e.id}" value="${e.date}" aria-label="Modifier la date"><button class="btn" data-id="${e.id}">Modifier</button></div>`;
  });
  return h+'</div>';
}

function schedView(){
  const H0=8, PX=52, dow=(new Date().getDay()+6)%7+1;
  let h=`<div class="card"><div class="bar"><h2>Horaire de la semaine</h2><button class="btn pri" id="addBl">Ajouter un cours</button></div><div class="sw"><div class="sched"><div class="dh"></div>${DJ.map((d,i)=>`<div class="dh${i+1===dow?' today':''}">${d}</div>`).join('')}<div class="hrs">${Array.from({length:12},(_,i)=>`<i style="top:${i*PX}px">${H0+i}h</i>`).join('')}</div>`;
  for(let d=1;d<=5;d++){
    h+=`<div class="col">`;
    st.bl.filter(b=>b.day===d).forEach(b=>{
      const top=(tm(b.start)-H0)*PX, ht=(tm(b.end)-tm(b.start))*PX-2;
      h+=`<button class="blk" data-c="${b.course}" data-bid="${b.id}" style="top:${top}px;height:${ht}px"><b>${esc(b.title)}</b><span>${b.start}–${b.end}${b.room?' · '+esc(b.room):''}</span></button>`;
    });
    h+='</div>';
  }
  return h+'</div></div></div>';
}

const num=v=>{if(v==null||v==='')return null;const n=+String(v).replace(',','.');return isNaN(n)?null:n};
const f1=(x,d=1)=>x==null||isNaN(x)?'–':x.toFixed(d).replace('.',',');
const U=v=>{v=String(v||'').trim().replace(',','.');if(v.includes('-')){const a=v.split('-').map(Number);return a.length===3&&a.every(x=>x>=0)?(a[0]+a[1]+a[2])/3:0}return +v||0};
function calc(c){
  const ds=c.ev.map(e=>({w:num(e.w),g:num(e.grade),m:num(e.mean),s:num(e.sd)})),
    ok=ds.filter(e=>e.w>0&&e.g!=null&&e.m!=null&&e.s!=null),
    ignored=ds.filter(e=>e.g!=null).length-ok.length, W=ok.reduce((a,e)=>a+e.w,0);
  if(!W)return{n:0,ignored};
  const P=st.gr.p, rho=Math.min(1,Math.max(0,num(P.rho)??.7)),
    note=ok.reduce((a,e)=>a+e.w*e.g,0)/W,
    mean=num(c.fm)??ok.reduce((a,e)=>a+e.w*e.m,0)/W,
    A=ok.reduce((a,e)=>a+e.w*e.s,0)/W, B2=ok.reduce((a,e)=>a+(e.w*e.s/W)**2,0),
    sd=num(c.fs)??Math.sqrt((1-rho)*B2+rho*A*A),
    z=sd>0?(note-mean)/sd:0,
    R=(z*(num(c.idgz)??num(P.idgz)??1)+(num(c.ifgz)??num(P.ifgz)??0)+5)*5;
  return{n:ok.length,ignored,W,note,mean,sd,z,R};
}
function notesView(){
  const P=st.gr.p, inp=(a,v,x='')=>`<input ${a} value="${esc(v)}" inputmode="decimal" ${x}>`;
  let h=`<div class="card"><div class="bar"><h2>Notes et cote R</h2><button class="btn pri" id="addCo">Ajouter un cours</button></div><div class="rg" id="glob"></div>
  <div class="par"><label>IFGZ (force du groupe)${inp('data-p="ifgz"',P.ifgz)}</label><label>IDGZ (dispersion du groupe)${inp('data-p="idgz"',P.idgz)}</label><label>Corrélation entre évaluations (0 à 1)${inp('data-p="rho"',P.rho)}</label></div>
  <p class="hint">Formule : R = (Z × IDGZ + IFGZ + 5) × 5, où Z = (ta note − moyenne du groupe) ÷ écart type du groupe. Le Ministère calcule l'IFGZ et l'IDGZ après la session : les valeurs de départ (0 et 1) représentent un groupe moyen, et tu peux les changer. L'écart type de la note finale est estimé à partir de celui de chaque évaluation et de la corrélation choisie. Seules les évaluations avec note, moyenne et écart type comptent. Le résultat reste une estimation.</p></div>`;
  st.gr.c.forEach(c=>{
    h+=`<div class="card co" data-co="${c.id}"><div class="bar"><input class="nm" data-f="name" value="${esc(c.name)}" aria-label="Nom du cours"><label class="u">Unités (ex. 3-1-3)<input data-f="units" value="${esc(c.units)}"></label><button class="btn del" data-delco>Supprimer</button></div>
    <div class="sw"><table class="ev"><thead><tr><th>Évaluation</th><th>Pond. %</th><th>Ma note %</th><th>Moy. groupe %</th><th>Écart type</th><th></th></tr></thead><tbody>`;
    c.ev.forEach(e=>{h+=`<tr data-ev="${e.id}"><td><input data-e="name" value="${esc(e.name)}" aria-label="Nom"></td>${['w','grade','mean','sd'].map(k=>`<td>${inp('data-e="'+k+'"',e[k])}</td>`).join('')}<td><button class="btn" data-delev aria-label="Supprimer l'évaluation">×</button></td></tr>`});
    h+=`</tbody></table></div><button class="btn" data-addev>Ajouter une évaluation</button>
    <details><summary>Si tu les connais : valeurs finales et paramètres de ce cours</summary><div class="par"><label>Moyenne finale du groupe %${inp('data-f="fm"',c.fm)}</label><label>Écart type final du groupe${inp('data-f="fs"',c.fs)}</label><label>IFGZ du cours${inp('data-f="ifgz"',c.ifgz)}</label><label>IDGZ du cours${inp('data-f="idgz"',c.idgz)}</label></div></details>
    <div id="res-${c.id}"></div></div>`;
  });
  return h;
}
function results(){
  if(view!=='notes')return;
  let sr=0,sn=0,su=0,nc=0;
  st.gr.c.forEach(c=>{
    const r=calc(c),u=U(c.units),el=document.querySelector('#res-'+c.id); if(!el)return;
    const ig=r.ignored?`<p class="hint">${r.ignored} évaluation(s) ignorée(s) : il manque la moyenne ou l'écart type du groupe.</p>`:'';
    if(!r.n){el.innerHTML=`<p class="hint">Entre au moins une évaluation complète (pondération, note, moyenne et écart type du groupe) pour voir ta cote R.</p>${ig}`;return}
    el.innerHTML=`<div class="kp"><div><b>${f1(r.note)} %</b><span>Note actuelle</span></div><div><b>${f1(r.mean)} %</b><span>Moyenne du groupe</span></div><div><b>${f1(r.sd)}</b><span>Écart type estimé</span></div><div><b>${f1(r.z,2)}</b><span>Cote Z</span></div><div class="r"><b>${f1(r.R)}</b><span>Cote R estimée</span></div></div><p class="hint">Basé sur ${f1(r.W,0)} % de la note finale (${r.n} évaluation(s)).${u?'':' Entre les unités du cours pour l\'inclure dans la cote R globale.'}</p>${ig}`;
    if(u>0){sr+=r.R*u;sn+=r.note*u;su+=u;nc++}
  });
  document.querySelector('#glob').innerHTML=su?`<div><b>${f1(sr/su)}</b><span>Cote R globale estimée</span></div><div><b>${f1(sn/su)} %</b><span>Moyenne pondérée</span></div><div><span>${nc} cours inclus, pondérés par les unités</span></div>`:`<div><span>La cote R globale apparaît dès qu'un cours a une évaluation complète et des unités.</span></div>`;
}
function render(){
  hero();
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===view));
  $('#view').innerHTML=view==='cal'?calView():view==='list'?listView():view==='sched'?schedView():notesView();
  results();
}

// Dialogs
const dEv=$('#dEv'), fEv=$('#fEv'), dBl=$('#dBl'), fBl=$('#fBl');
const opts=o=>Object.entries(o).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
fEv.course.innerHTML=opts(CO); fEv.type.innerHTML=opts(TY);
fBl.course.innerHTML=opts(CO); fBl.day.innerHTML=DJ.map((d,i)=>`<option value="${i+1}">${d}</option>`).join('');
let editId=null, editBl=null;
function openEv(id,date){
  editId=id; const e=id&&st.ev.find(x=>x.id===id);
  $('#evT').textContent=e?"Modifier l'élément":'Nouvel élément';
  $('#evDel').hidden=!e;
  fEv.title.value=e?e.title:''; fEv.course.value=e?e.course:(fCourse||'alg'); fEv.type.value=e?e.type:'devoir';
  fEv.date.value=e?e.date:(date||todayS()); fEv.time.value=e?e.time||'':''; fEv.notes.value=e?e.notes||'':''; fEv.approx.checked=e?!!e.approx:false;
  dEv.showModal();
}
function openBl(id){
  editBl=id; const b=id&&st.bl.find(x=>x.id===id);
  $('#blT').textContent=b?'Modifier le cours':'Nouveau cours';
  $('#blDel').hidden=!b;
  fBl.title.value=b?b.title:''; fBl.course.value=b?b.course:'autre'; fBl.day.value=b?b.day:1;
  fBl.start.value=b?b.start:'08:00'; fBl.end.value=b?b.end:'09:50'; fBl.room.value=b?b.room||'':'';
  dBl.showModal();
}
fEv.addEventListener('submit',()=>{
  const v={title:fEv.title.value.trim(),course:fEv.course.value,type:fEv.type.value,date:fEv.date.value,time:fEv.time.value,notes:fEv.notes.value.trim(),approx:fEv.approx.checked};
  if(!v.title||!v.date)return;
  if(editId){Object.assign(st.ev.find(x=>x.id===editId),v)}else st.ev.push({...v,id:uid(),done:false});
  save();render();
});
fBl.addEventListener('submit',e=>{
  const v={title:fBl.title.value.trim(),course:fBl.course.value,day:+fBl.day.value,start:fBl.start.value,end:fBl.end.value,room:fBl.room.value.trim()};
  if(!v.title||tm(v.end)<=tm(v.start)){e.preventDefault();alert("L'heure de fin doit être après l'heure de début.");return}
  if(editBl){Object.assign(st.bl.find(x=>x.id===editBl),v)}else st.bl.push({...v,id:uid()});
  save();render();
});
$('#evDel').onclick=()=>{if(confirm('Supprimer cet élément ?')){st.ev=st.ev.filter(x=>x.id!==editId);save();dEv.close();render()}};
$('#blDel').onclick=()=>{if(confirm('Supprimer ce cours ?')){st.bl=st.bl.filter(x=>x.id!==editBl);save();dBl.close();render()}};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());

// Events
document.addEventListener('click',e=>{
  const t=e.target;
  const tab=t.closest('.tab'); if(tab){view=tab.dataset.v;render();return}
  if(t.closest('#add')){openEv(null);return}
  if(t.closest('#addBl')){openBl(null);return}
  if(t.closest('#addCo')){st.gr.c.push({id:uid(),name:'Nouveau cours',units:'2.33',ifgz:'',idgz:'',fm:'',fs:'',ev:[{id:uid(),name:'',w:'',grade:'',mean:'',sd:''}]});save();render();return}
  const co=t.closest('[data-co]');
  if(co){
    const c=st.gr.c.find(x=>x.id===co.dataset.co);
    if(t.closest('[data-delco]')){if(confirm('Supprimer ce cours et ses notes ?')){st.gr.c=st.gr.c.filter(x=>x!==c);save();render()}return}
    if(t.closest('[data-addev]')){c.ev.push({id:uid(),name:'',w:'',grade:'',mean:'',sd:''});save();render();return}
    const dv=t.closest('[data-delev]');
    if(dv){c.ev=c.ev.filter(x=>x.id!==dv.closest('[data-ev]').dataset.ev);save();render();return}
    return;
  }
  const nv=t.closest('[data-nav]'); if(nv){const n=+nv.dataset.nav;if(n===0){cur=new Date();cur.setDate(1)}else cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);render();return}
  const bid=t.closest('[data-bid]'); if(bid){openBl(bid.dataset.bid);return}
  const id=t.closest('[data-id]'); if(id){openEv(id.dataset.id);return}
  const dy=t.closest('.day'); if(dy){openEv(null,dy.dataset.date)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.done){const ev=st.ev.find(x=>x.id===t.dataset.done);ev.done=t.checked;save();render()}
  else if(t.dataset.date){const ev=st.ev.find(x=>x.id===t.dataset.date);if(ev&&t.value){ev.date=t.value;save();render()}}
  else if(t.id==='fPer'){fPer=t.value;render()}
  else if(t.id==='fCo'){fCourse=t.value;render()}
});
document.addEventListener('input',e=>{
  const t=e.target, co=t.closest('[data-co]');
  if(t.dataset.p){st.gr.p[t.dataset.p]=t.value}
  else if(co){
    const c=st.gr.c.find(x=>x.id===co.dataset.co), r=t.closest('[data-ev]');
    if(r&&t.dataset.e){c.ev.find(x=>x.id===r.dataset.ev)[t.dataset.e]=t.value}
    else if(t.dataset.f){c[t.dataset.f]=t.value}
    else return;
  }else return;
  save();results();
});
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(st,null,2)],{type:'application/json'}));a.download='agenda-automne-2026.json';a.click();URL.revokeObjectURL(a.href)};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.ev)||!Array.isArray(d.bl))throw 0;st={ev:d.ev,bl:d.bl,gr:d.gr||st.gr};save();render()}
  catch(x){alert("Fichier invalide. Importe un fichier exporté par cette application.")}
  e.target.value='';
};
$('#rst').onclick=()=>{if(confirm('Remettre toutes les données de départ ? Tes modifications seront perdues.')){st={ev:SEED_EV(),bl:SEED_BL(),gr:SEED_GR()};save();render()}};
$('#theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
try{localStorage.setItem(KEY+'-t','1')}catch(e){document.querySelector('#warn').hidden=false}
render();
</script>
</body>
